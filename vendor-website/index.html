    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/printlly-mark.png" />

    <link rel="preload" href="/fonts/Manrope_700Bold.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="/fonts/Inter_400Regular.ttf" as="font" type="font/ttf" crossorigin />
    <!-- The scroll-reveal utility starts elements at opacity 0 and lets
         JS flip them in. Without JS nothing would ever flip, so force
         them visible in that case rather than shipping a blank page. -->
    <noscript>
      <style>
        .reveal,
        .draw-line {
          opacity: 1 !important;
          transform: none !important;
        }
      </style>
    </noscript>
