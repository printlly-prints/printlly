<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Paprout pe bhej de. Upload your documents, choose a nearby print shop and collect when your prints are ready."
    />
    <meta name="theme-color" content="#FAFAF7" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/brand/paprout-icon.png" />
    <title>Paprout — Your next print, minus the wait</title>

    <!-- Inter for the workspace; Manrope, DM Sans and Caveat for the public website. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- The scroll-reveal utility starts elements at opacity 0 and lets
         JS flip them in. Without JS nothing would ever flip, so force
         them visible in that case rather than shipping a blank page. -->
    <noscript>
      <style>
        .reveal,
        .draw-line {
          opacity: 1 !important;
          transform: none !important;
        }
      </style>
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
