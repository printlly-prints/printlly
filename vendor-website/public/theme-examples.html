&lt;script type=&quot;application/json&quot; id=&quot;codex-visualization-widget-state&quot;&gt;__CODEX_VISUALIZATION_WIDGET_STATE__&lt;/script&gt;
&lt;script&gt;(() =&gt; {
  const root = document.documentElement;
  const mediaQuery = globalThis.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);

  const isArray = Array.isArray;
  const hasOwn = Object.hasOwn;
  const parentWindow = globalThis.parent;
  const stringify = JSON.stringify;
  const parse = JSON.parse;

    &quot;codex-visualization-widget-state&quot;,
  );
  const initialGlobals = parse(initialStateElement?.textContent ?? &quot;{}&quot;);
  initialStateElement?.remove();
  /** @type {Record&lt;string, unknown&gt; | null} */
  let state = initialGlobals.widgetState ?? null;
  const statePersistence = initialGlobals.statePersistence ?? &quot;none&quot;;
  let nextStateRequestId = 0;
  /** @type {Map&lt;number, { resolve: () =&gt; void; reject: (error: Error) =&gt; void; timeout: ReturnType&lt;typeof globalThis.setTimeout&gt;; serializedState: string }&gt;} */
  const pendingStateWrites = new Map();
  const persistenceError = () =&gt;
    Object.assign(
      new Error(&quot;The host could not persist the widget state update&quot;),
      {
        code: -32000,
        data: { code: &quot;widget_state_persistence_failed&quot;, retryable: false },
      },
    );
  /**
   * @param {object} prototype
   * @param {string} property
   */
  const getPrototypeGetter = (prototype, property) =&gt; {
    // oxlint-disable-next-line typescript/unbound-method -- invoked through captured Reflect.apply
    const getter = Object.getOwnPropertyDescriptor(prototype, property)?.get;
    if (getter == null) {
      throw new Error(`Missing ${property} getter`);
    }
    return getter;
  };

  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, &quot;ports&quot;);
  const getMessageSource = getPrototypeGetter(MessageEvent.prototype, &quot;source&quot;);

  const addHostMessageListener = MessagePort.prototype.addEventListener;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const postHostMessage = MessagePort.prototype.postMessage;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const startHostPort = MessagePort.prototype.start;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const stopMessagePropagation = Event.prototype.stopImmediatePropagation;

  let hostPort = null;
  const postToHost = (type, payload) =&gt; {

    }

   */

    const nextState = typeof next === &quot;function&quot; ? next(state) : next;
    if (
      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }

      nextState,
      (_key, /** @type {unknown} */ value) =&gt; {

          typeof value === &quot;undefined&quot; ||
          typeof value === &quot;function&quot; ||
          typeof value === &quot;symbol&quot; ||
          (typeof value === &quot;number&quot; &amp;&amp; !Number.isFinite(value))

      parsedState == null ||
      typeof parsedState !== &quot;object&quot; ||
      isArray(parsedState)

      privateContent: null,

      hasOwn(storedState, &quot;imageIds&quot;) &amp;&amp;

      throw new TypeError(&quot;Widget state imageIds must be an array of strings&quot;);
    }

        new TypeError(&quot;Visualization state does not support image attachments&quot;),

    globalThis.openai.widgetState = state;

      new CustomEvent(&quot;openai:set_globals&quot;, {

      throw persistenceError();
    }

      const timeout = globalThis.setTimeout(() =&gt; {
        pendingStateWrites.delete(id);
        reject(persistenceError());

      pendingStateWrites.set(id, { resolve, reject, timeout, serializedState });

    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},

      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),
    );
  };

    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;

              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== &quot;number&quot;) {
                return;
              }
              const pending = pendingStateWrites.get(id);
              if (pending != null) {
                pendingStateWrites.delete(id);

                } else {

      } catch {
        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {

    { capture: true },
  );

  globalThis.addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.defaultPrevented) {
      return;
    }
    let element = null;
    if (event.target instanceof globalThis.Element) {
      element = event.target;
    } else if (event.target instanceof globalThis.Node) {
      element = event.target.parentElement;
    }

    const href = link?.getAttribute(&quot;href&quot;);
    if (href == null) {
      return;
    }
    if (href.startsWith(&quot;#&quot;)) {

        id = decodeURIComponent(href.slice(1));

      }

        target == null ||

&lt;style&gt;
#printlly-colour-studio .pt-design{--pt-paper:#fafaf7;--pt-ink:#242426;--pt-muted:#616164;--pt-action:#007c9c;--pt-tint:#e2f0f2;--pt-pop:#f2d85b;--pt-second:#d6a0b8;--pt-border:#deded8;font-family:&#x27;DM Sans&#x27;,sans-serif;color:var(--pt-ink);font-size:14px;line-height:1.5;min-height:650px}
#printlly-colour-studio .pt-blue{--pt-paper:#faf8ef;--pt-ink:#202d53;--pt-muted:#5d6480;--pt-action:#2343a5;--pt-tint:#e5eaf6;--pt-pop:#f0db75;--pt-second:#9eaedc;--pt-border:#dcdedc}
#printlly-colour-studio .pt-riso{--pt-paper:#faf3e6;--pt-ink:#262b43;--pt-muted:#656574;--pt-action:#2e43b8;--pt-tint:#dee3fa;--pt-pop:#e36b53;--pt-second:#efb4a1;--pt-border:#ded8cf}
#printlly-colour-studio .pt-design *{box-sizing:border-box}
#printlly-colour-studio .pt-theme-label{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:8px 0 16px;font-size:14px;font-weight:500;color:var(--foreground)}
#printlly-colour-studio .pt-swatch-row{display:flex;gap:6px;padding-right:96px}
#printlly-colour-studio .pt-swatch-row b{display:block;width:20px;height:20px;border-radius:50%;border:1px solid #80808030}
#printlly-colour-studio .pt-site{background:var(--pt-paper);color:var(--pt-ink);padding:0 36px;border-radius:10px;overflow:hidden;border:1px solid var(--pt-border)}
#printlly-colour-studio .pt-nav{display:flex;align-items:center;justify-content:space-between;gap:20px;height:76px;border-bottom:1px solid var(--pt-border)}
#printlly-colour-studio .pt-logo{display:flex;align-items:center;gap:7px;font-family:&#x27;Manrope&#x27;,sans-serif;font-weight:800;font-size:27px;letter-spacing:-1.8px;white-space:nowrap}
#printlly-colour-studio .pt-logo&gt;svg{width:26px;height:26px;stroke-width:1.7;letter-spacing:0}
#printlly-colour-studio .pt-logo&gt;span{color:var(--pt-action);margin-left:-7px}
#printlly-colour-studio .pt-nav&gt;nav{display:flex;gap:24px;align-items:center;font-size:11px}
#printlly-colour-studio .pt-nav button{font-size:11px}
#printlly-colour-studio .pt-nav-app{display:flex;gap:12px;align-items:center;justify-content:center;padding:11px 15px;min-height:40px;border:0;border-radius:6px;background:var(--pt-action);color:white;font-weight:500}
#printlly-colour-studio .pt-nav-app svg{width:15px;height:15px}
#printlly-colour-studio .pt-hero{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:center;min-height:470px;padding:28px 0 20px}
#printlly-colour-studio .pt-copy{position:relative;z-index:2;padding-bottom:12px}
#printlly-colour-studio .pt-eyebrow{display:flex;gap:8px;align-items:center;font-size:11px;color:var(--pt-muted);margin:0 0 20px}
#printlly-colour-studio .pt-eyebrow&gt;span{font-size:22px;color:var(--pt-action);line-height:1}
#printlly-colour-studio .pt-copy&gt;h1{font-family:&#x27;Manrope&#x27;,sans-serif;font-weight:600;line-height:1.1;letter-spacing:-2.5px;font-size:clamp(32px,4.4vw,49px);margin:0;color:var(--pt-ink)}
#printlly-colour-studio .pt-copy&gt;h1&gt;span{color:var(--pt-action)}
#printlly-colour-studio .pt-description{font-size:14px;line-height:1.8;color:var(--pt-muted);max-width:300px;margin:20px 0 0}
#printlly-colour-studio .pt-actions{display:flex;align-items:center;flex-wrap:wrap;gap:20px;margin-top:24px}
#printlly-colour-studio button{font-family:&#x27;DM Sans&#x27;,sans-serif;cursor:var(--cursor-interactive,pointer)}
#printlly-colour-studio .pt-cta{display:inline-flex;width:fit-content;align-items:center;gap:24px;padding:14px 20px;min-height:48px;border:0;border-radius:6px;background:var(--pt-action);color:white;font-size:12px;font-weight:500;transition:transform .15s,filter .15s}
#printlly-colour-studio .pt-cta:hover,#printlly-colour-studio .pt-nav-app:hover{filter:brightness(.9);transform:translateY(-1px)}
#printlly-colour-studio .pt-cta:active,#printlly-colour-studio .pt-nav-app:active{transform:translateY(1px)}
#printlly-colour-studio .pt-quiet{display:inline-flex;gap:8px;align-items:center;padding:8px 0;min-height:40px;border:0;background:transparent;color:var(--pt-ink);font-weight:500;font-size:11px}
#printlly-colour-studio .pt-quiet:hover{text-decoration:underline;text-underline-offset:5px}
#printlly-colour-studio .pt-actions svg{width:16px;height:16px;stroke-width:1.7}
#printlly-colour-studio .pt-footnote{display:flex;align-items:center;gap:6px;color:var(--pt-muted);font-size:10px;margin:20px 0 0}
#printlly-colour-studio .pt-footnote svg{width:13px;height:13px}
#printlly-colour-studio .pt-art{height:420px;position:relative;min-width:0}
#printlly-colour-studio .pt-sheet{position:absolute;width:72%;height:77%;top:12%;left:12%;border-radius:12px 36px 12px 12px;border:1px solid color-mix(in srgb,var(--pt-ink) 10%,transparent)}
#printlly-colour-studio .pt-sheet-back{background:var(--pt-pop);transform:rotate(-9deg)}
#printlly-colour-studio .pt-sheet-front{background:var(--pt-tint);transform:rotate(5deg);overflow:hidden}
#printlly-colour-studio .pt-fold{position:absolute;right:0;top:0;width:36px;height:36px;border-left:1px solid var(--pt-border);border-bottom:1px solid var(--pt-border);border-radius:0 0 0 8px;background:var(--pt-paper)}
#printlly-colour-studio .pt-rule{position:absolute;left:12%;top:16%;width:28%;height:3px;background:color-mix(in srgb,var(--pt-action) 14%,transparent);box-shadow:0 15px 0 color-mix(in srgb,var(--pt-action) 14%,transparent),0 30px 0 color-mix(in srgb,var(--pt-action) 14%,transparent)}
#printlly-colour-studio .pt-person{position:absolute;left:16%;bottom:0;width:78%;height:100%;object-fit:contain}
#printlly-colour-studio .pt-handnote{position:absolute;right:-8px;top:5%;font-size:13px;line-height:1.1;transform:rotate(8deg);font-weight:500}
